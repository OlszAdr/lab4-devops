name: CI/CD Pipeline - Automated Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ETAP 1: TESTY AUTOMATYCZNE
  test:
    name: Build & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchomienie testów (pytest)
        run: pytest -v

  # ETAP 2: BUDOWANIE I PUBLIKACJA OBRAZU DOCKER
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Logowanie do GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Budowanie i wypchnięcie obrazu Dockera
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ETAP 3: AUTOMATYCZNY DEPLOYMENT NA ŚRODOWISKO TESTOWE + POWIADOMIENIE
  deploy-staging:
    name: Deploy to Staging & Notify
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Wdrożenie stosu Docker Compose na środowisku testowym
        run: |
          docker compose up -d --build
          sleep 5

      - name: Test integracyjny (Smoke Test wdrożonej aplikacji)
        run: |
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/

      - name: Powiadomienie o statusie wdrożenia
        if: always()
        run: |
          echo "=== POWIADOMIENIE DEVOPS ==="
          echo "Status wdrożenia: ${{ job.status }}"
          echo "Commit: ${{ github.sha }} | Autor: ${{ github.actor }}"
